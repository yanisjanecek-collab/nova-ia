<script type="module">
import {CreateMLCEngine} from "https://esm.run/@mlc-ai/web-llm";
const $=id=>document.getElementById(id);
let tab="chat",engine=null,busy=false,autoVoice=false,recognition=null,currentPhoto=null,currentFile=null;
let msgs=JSON.parse(localStorage.getItem("nova-v5")||"null")||[{role:"assistant",content:"Salut ! Je suis Nova ✨\\nJe peux discuter, parler avec toi, créer des fichiers, préparer du code exportable et générer des images."}];
const model="Llama-3.2-1B-Instruct-q4f32_1-MLC";

function save(){localStorage.setItem("nova-v5",JSON.stringify(msgs))}
function speak(text){
  if(!("speechSynthesis" in window)){
    alert("La lecture vocale n’est pas disponible dans ce navigateur.");
    return;
  }
  speechSynthesis.cancel();
  const clean=String(text||"").replace(/```[\s\S]*?```/g," ").replace(/\s+/g," ").trim().slice(0,3000);
  if(!clean)return;
  const u=new SpeechSynthesisUtterance(clean);
  u.lang="fr-FR"; u.rate=.98; u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const fr=voices.find(v=>/^fr(-|_)/i.test(v.lang));
  if(fr)u.voice=fr;
  speechSynthesis.speak(u);
}
function render(){
  $("chat").innerHTML="";
  if(tab==="chat"){
    let w=document.createElement("div");w.className="welcome";w.innerHTML='<div class="star">✦</div><h1>Que veux-tu faire avec Nova ?</h1><p>Parler • créer • coder • exporter</p>'; $("chat").append(w);
    let box=document.createElement("div");box.className="msgs";
    msgs.forEach(m=>{let d=document.createElement("div");d.className="m "+m.role;d.innerHTML='<div class="ava">'+(m.role==="assistant"?"✦":"👤")+'</div><div><div class="bubble"></div><div class="msg-actions"></div></div>';const bubble=d.querySelector(".bubble");
    if(m.photo){const pim=document.createElement("img");pim.className="message-photo";pim.src=m.photo;pim.alt=m.photoName||"Photo jointe";bubble.appendChild(pim)}
    if(m.fileName){const fi=document.createElement("div");fi.textContent="📎 "+m.fileName;fi.style.marginBottom="8px";bubble.appendChild(fi)}
    const tx=document.createElement("div");tx.textContent=m.content;bubble.appendChild(tx);
    const actions=d.querySelector(".msg-actions");const copy=document.createElement("button");copy.textContent="📋 Copier";copy.onclick=()=>copyText(m.content,copy);actions.append(copy);if(m.role==="assistant"){const code=extractCode(m.content);if(code){const b=document.createElement("button");b.textContent="📄 Créer le fichier";b.onclick=()=>downloadText("nova-code."+code.ext,code.code);actions.append(b)}}box.append(d)});
    $("chat").append(box);

  } else {renderTool();$("composer").style.display="none"}
  $("chat").scrollTop=$("chat").scrollHeight;
}
function renderTool(){

    image:`<div class="panel"><h2>🎨 Créer une image</h2><p>Écris une description puis Nova lance une génération d’image via un service web public.</p><textarea id="imgPrompt" class="codearea" style="min-height:130px" placeholder="Ex. Un renard astronaute sur Mars, style cinématographique"></textarea><div class="actions"><button class="primary" id="genImg">✨ Générer</button></div><div id="imgOut"></div></div>`,
    file:`<div class="panel"><h2>📄 Créer un fichier</h2><p>Choisis le type, donne un nom et colle le contenu. Nova téléchargera directement le fichier sur ton appareil.</p><div class="grid"><div class="card"><h3>Nom</h3><input id="fileName" value="nova-document.txt" style="width:100%;padding:10px;background:#0e1219;border:1px solid #3a4352;color:#fff;border-radius:9px"></div><div class="card"><h3>Type</h3><select id="fileType" style="width:100%;padding:10px;background:#0e1219;border:1px solid #3a4352;color:#fff;border-radius:9px"><option value="txt">TXT</option><option value="md">Markdown</option><option value="html">HTML</option><option value="css">CSS</option><option value="js">JavaScript</option><option value="json">JSON</option><option value="csv">CSV</option></select></div></div><textarea id="fileContent" class="codearea" placeholder="Contenu du fichier…"></textarea><div class="actions"><button class="primary" id="downloadFile">⬇️ Télécharger</button><button class="ghost" id="makeStarter">✨ Mettre un modèle</button></div></div>`,
    code:`<div class="panel"><h2>💻 Coder et exporter</h2><p>Écris ou colle du code. Tu peux le télécharger directement comme fichier.</p><textarea id="codeContent" class="codearea" placeholder="Colle ton code ici…"></textarea><div class="actions"><button class="primary" id="downloadCode">⬇️ Télécharger le code</button><button class="ghost" id="openPreview">👁️ Aperçu HTML</button></div><div id="preview"></div></div>`,
    create:`<div class="panel"><h2>🧩 Atelier Jeux & Applications</h2><p>Crée un projet complet dans un seul fichier HTML, puis teste-le ou télécharge-le.</p><div class="grid"><div class="card"><h3>🎮 Jeux</h3><button class="ghost template" data-prompt="Crée un jeu Snake complet, jouable au clavier, avec score et bouton recommencer. Un seul fichier HTML.">Snake</button><button class="ghost template" data-prompt="Crée un jeu de mémoire avec cartes, score et bouton recommencer. Un seul fichier HTML.">Mémoire</button><button class="ghost template" data-prompt="Crée un jeu de clic rapide de 30 secondes avec score et meilleur score local. Un seul fichier HTML.">Clic rapide</button></div><div class="card"><h3>📱 Applications</h3><button class="ghost template" data-prompt="Crée une application de tâches avec ajout, suppression, cases cochées et sauvegarde locale. Un seul fichier HTML.">To-do</button><button class="ghost template" data-prompt="Crée une application de notes avec création, édition, suppression et sauvegarde locale. Un seul fichier HTML.">Notes</button><button class="ghost template" data-prompt="Crée une calculatrice complète et moderne. Un seul fichier HTML.">Calculatrice</button></div></div><textarea id="createPrompt" class="codearea" style="min-height:140px" placeholder="Décris précisément ton jeu ou ton application…"></textarea><div class="actions"><button class="primary" id="createProject">✨ Créer</button><button class="ghost" id="downloadProject">⬇️ Télécharger</button><button class="ghost" id="previewProject">👁️ Tester</button></div><p class="small" id="createStatus">Charge l’IA locale pour générer automatiquement le projet.</p><textarea id="projectCode" class="codearea" placeholder="Le code du projet apparaîtra ici…"></textarea><div id="projectPreview"></div></div>`,
    private:`<div class="panel"><h2>🔐 Espace privé</h2><p>Un code local peut ouvrir une zone spéciale sur cet appareil. Pour une vraie zone sécurisée accessible à plusieurs utilisateurs, il faudra un serveur d’authentification.</p><div class="card"><h3>Accès</h3><button class="primary" id="privateOpen">Entrer avec le code</button></div><div id="privateArea" class="hide"><h3>Zone privée</h3><p class="small">Tu peux y mettre tes réglages et outils réservés à toi.</p><button class="ghost" id="lock">Verrouiller</button></div></div>`
  };
  $("chat").innerHTML=panels[tab];

function setupImage(){
  $("genImg").onclick=async()=>{
    const p=$("imgPrompt").value.trim(); if(!p)return;
    $("imgOut").innerHTML="<p class='small'>⏳ Génération…</p>";

    im.onload=()=>{$("imgOut").innerHTML="";$("imgOut").append(im);let a=document.createElement("a");a.href=src;a.download="nova-image.png";a.textContent="⬇️ Ouvrir / enregistrer l’image";a.className="small";a.style.display="block";a.style.marginTop="10px";$("imgOut").append(a)};
    im.onerror=()=>{$("imgOut").innerHTML="<p>La génération d’image n’est pas disponible depuis ce service pour le moment.</p>"};

function setupFile(){
  $("makeStarter").onclick=()=>{
    const t=$("fileType").value;
    const starters={
      txt:"Document créé avec Nova.",
      md:"# Document Nova\\n\\nÉcris ton contenu ici.",

    $("fileName").value="nova-"+t+"."+t;
  };

function novaQuick(prefix){
  const input=$("input");
  if(input){
    input.value=prefix;
    input.focus();
    input.dispatchEvent(new Event("input",{bubbles:true}));
  }
}
function novaDownloadText(filename,content,mime="text/plain"){
  const blob=new Blob([content],{type:mime+";charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
window.novaDownloadText=novaDownloadText;

function setupCode(){
  $("downloadCode").onclick=()=>downloadText("nova-code."+guessExt($("codeContent").value),$("codeContent").value);
  $("openPreview").onclick=()=>{const c=$("codeContent").value; if(!c.trim())return; const box=$("preview");box.innerHTML='<iframe style="width:100%;height:320px;border:1px solid #343b49;border-radius:12px;background:white"></iframe>';box.firstChild.srcdoc=c};
}
function guessExt(c){if(/<html|<div|<!doctype/i.test(c))return"html";if(/function |=>|console\.log/i.test(c))return"js";if(/\{[\s\S]*:[\s\S]*;/.test(c))return"css";return"txt"}
function copyText(text,btn){navigator.clipboard?.writeText(text).then(()=>{const old=btn.textContent;btn.textContent="✓ Copié";setTimeout(()=>btn.textContent=old,1200)}).catch(()=>alert("La copie automatique n’est pas disponible. Sélectionne le texte puis copie-le."))}
function extractCode(text){const m=text.match(/```([a-zA-Z0-9_-]+)?\s*\n?([\s\S]*?)```/);if(!m)return null;let lang=(m[1]||"").toLowerCase();let ext={html:"html",htm:"html",javascript:"js",js:"js",css:"css",json:"json",python:"py",py:"py",typescript:"ts",ts:"ts",markdown:"md",md:"md",text:"txt",txt:"txt"}[lang]||"txt";return {code:m[2].trim(),ext}}
function downloadText(name,text){const blob=new Blob([text],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setupCreate(){
 document.querySelectorAll(".template").forEach(b=>b.onclick=()=>$("createPrompt").value=b.dataset.prompt);
 $("createProject").onclick=async()=>{const p=$("createPrompt").value.trim();if(!p)return;if(!engine){$("createStatus").textContent="⚠️ Clique sur « ⚡ Charger l’IA locale ».";return}$("createStatus").textContent="⏳ Création…";try{const r=await engine.chat.completions.create({messages:[{role:"system",content:"Tu crées des jeux et applications web. Retourne uniquement un fichier HTML autonome complet avec HTML, CSS et JavaScript dans le même fichier. Il doit être réellement utilisable, précis, responsive, sans dépendance externe, sans clé API. Ajoute une section Comment jouer / utiliser."},{role:"user",content:p}],temperature:.5,max_tokens:3500});const c=r.choices[0].message.content.replace(/^```(?:html)?\s*/i,"").replace(/\s*```$/i,"");$("projectCode").value=c;$("createStatus").textContent="✓ Projet créé."}catch(e){$("createStatus").textContent="❌ Erreur de création."}};
 $("downloadProject").onclick=()=>{const c=$("projectCode").value.trim();if(c)downloadText("nova-projet.html",c)};

}

$("unlock").onclick=()=>{if($("secret").value==="363941"){$("modal").classList.add("hide");$("privateArea").classList.remove("hide");$("secret").value=""}else alert("Code incorrect.")};

async function loadAI(){
 if(engine)return;
 $("status").innerHTML="● <b>Chargement du modèle…</b>";$("load").disabled=true;
 try{engine=await CreateMLCEngine(model,{initProgressCallback:p=>{$("status").innerHTML="● <b>Chargement "+Math.round((p.progress||0)*100)+"%</b>"}});
 $("status").innerHTML="● <b>IA locale prête</b>";$("load").textContent="✓ IA chargée"}catch(e){console.error(e);$("status").textContent="IA locale indisponible sur cet appareil";$("load").disabled=false}
}

function clearPhoto(){
  currentPhoto=null;
  $("photoInput").value="";
  $("photoAttachment").style.display="none";
  $("photoThumb").removeAttribute("src");
  $("photoName").textContent="";
}
function clearFile(){currentFile=null;$("fileInput").value="";$("fileAttachment").style.display="none";$("fileNameChat").textContent="";}
$("fileInput").onchange=async()=>{
 const f=$("fileInput").files?.[0]; if(!f)return;
 currentFile={name:f.name,type:f.type,size:f.size,text:null};
 if(f.type.startsWith("text/")||/\.(txt|md|csv|json|html?|css|js|ts|py|java|c|cpp)$/i.test(f.name)){try{currentFile.text=await f.text()}catch(e){}}
 $("fileNameChat").textContent=f.name;$("fileAttachment").style.display="flex";$("input").focus();
};
$("removeFile").onclick=clearFile;
$("photoInput").onchange=()=>{
  const f=$("photoInput").files?.[0];
  if(!f)return;
  if(!f.type.startsWith("image/")){alert("Choisis une image.");clearPhoto();clearFile();return}
  const reader=new FileReader();
  reader.onload=()=>{
    currentPhoto={data:reader.result,name:f.name};
    $("photoThumb").src=reader.result;
    $("photoName").textContent=f.name;
    $("photoAttachment").style.display="flex";
    $("input").focus();
  };
  reader.readAsDataURL(f);
};
$("removePhoto").onclick=clearPhoto;

async function send(){
 let text=$("input").value.trim();
 if(!text && !currentPhoto)return;
 if(busy)return;

 const photo=currentPhoto;
 const file=currentFile;
 const photoName=photo?.name||"photo";
 const displayText=text || (photo ? "Peux-tu regarder cette photo ?" : (file ? "Peux-tu m’aider avec ce fichier ?" : ""));
 let modelText=displayText;
 if(photo) modelText += "\n\n[Photo jointe : "+photoName+". L’IA locale actuelle est textuelle ; n’invente pas ce que tu vois si le modèle ne dispose pas de vision.]";
 if(file){modelText += "\n\n[Fichier joint : "+file.name+"]"; if(file.text) modelText += "\nContenu du fichier :\n"+file.text.slice(0,12000); else modelText += "\nLe contenu binaire n’est pas lisible directement par l’IA locale actuelle.";}

 if(!engine){
   msgs.push({role:"user",content:displayText,photo:photo?.data,photoName,fileName:file?.name});
   msgs.push({role:"assistant",content:"Clique d’abord sur « ⚡ Charger l’IA locale » pour activer les réponses IA gratuites dans le navigateur."});
   save();$("input").value="";clearPhoto();clearFile();render();return;
 }

 busy=true;$("input").value="";
 msgs.push({role:"user",content:displayText,photo:photo?.data,photoName});render();
 try{
  let r=await engine.chat.completions.create({
   messages:[
    {role:"system",content:"Tu es Nova, une assistante française utile. Propose des actions concrètes. Si une photo est jointe, tiens compte du fait qu’elle est affichée dans l’interface, mais n’invente jamais ce que tu vois si le modèle ne dispose pas de vision. Si l'utilisateur demande un fichier, donne un contenu complet et précise le nom et l'extension. Si l'utilisateur demande du code, fournis du code prêt à enregistrer dans un bloc ```langage ...```. Ne prétends pas avoir exécuté une action externe si ce n’est pas le cas."},
    ...msgs.filter((x,i)=>!(x===msgs[msgs.length-1])).map(x=>({role:x.role,content:x.content})),
    {role:"user",content:modelText}
   ],
   temperature:.7,max_tokens:900
  });
  let ans=r.choices[0].message.content;
  msgs.push({role:"assistant",content:ans});save();if(autoVoice)speak(ans);
 }catch(e){
  console.error(e);
  msgs.push({role:"assistant",content:"Une erreur est survenue pendant la réponse IA."});
 }
 busy=false;clearPhoto();clearFile();render();
}


let recognition=null;
let listening=false;

function setMicState(on){
  listening=on;
  const b=$("mic");
  if(!b)return;
  b.textContent=on?"Arrêter":"Parler";
  b.classList.toggle("live",on);
}

function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    alert("La dictée vocale n’est pas disponible dans ce navigateur. Utilise Google Chrome.");
    return;
  }
  if(listening){
    try{recognition?.stop()}catch(e){}
    setMicState(false);
    return;
  }

  recognition=new SR();
  recognition.lang="fr-FR";
  recognition.continuous=false;
  recognition.interimResults=true;
  let finalText="";

  recognition.onstart=()=>setMicState(true);

  recognition.onresult=(event)=>{
    let interim="";
    finalText="";
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t=event.results[i][0].transcript;
      if(event.results[i].isFinal) finalText+=t;
      else interim+=t;
    }
    $("input").value=(finalText||interim).trim();
  };

  recognition.onerror=(event)=>{
    setMicState(false);
    if(event.error==="not-allowed"||event.error==="service-not-allowed"){
      alert("Autorise le micro pour Nova dans Chrome, puis appuie à nouveau sur « Parler ».");
    }else if(event.error==="no-speech"){
      alert("Je n’ai rien entendu. Appuie sur « Parler » et parle.");
    }
  };

  recognition.onend=()=>{
    const text=$("input").value.trim();
    setMicState(false);
    recognition=null;
    if(text && !busy) setTimeout(()=>send(),120);
  };

  try{recognition.start();}
  catch(e){setMicState(false);recognition=null;alert("Impossible de démarrer le micro. Réessaie.");}
}

$("mic").onclick=startMic;

$("autoVoice").onclick=()=>{
  autoVoice=!autoVoice;
  $("autoVoice").textContent=autoVoice?"🔊 Lecture : on":"🔊 Lecture : off";
  if(!autoVoice && "speechSynthesis" in window) speechSynthesis.cancel();
};

$("testVoice").onclick=()=>{
  speak("Bonjour, je suis Nova. La voix fonctionne.");
};

$("new").onclick=()=>{msgs=[{role:"assistant",content:"Nouvelle discussion ✨ Que veux-tu créer ?"}];clearPhoto();clearFile();save();tab="chat";document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));document.querySelector('[data-tab="chat"]').classList.add("on");
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("input").value=b.textContent;send()});
render();
</script>
